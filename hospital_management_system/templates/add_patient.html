{% extends 'base.html' %}
{% block title %}Add Patient{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body">
        <h3 class="mb-3">Add Patient</h3>
        <form method="post" class="row g-3">
            <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
            <div class="col-md-3"><label class="form-label">Age</label><input type="number" class="form-control" name="age" required></div>
            <div class="col-md-3">
                <label class="form-label">Gender</label>
                <select class="form-select" name="gender" required>
                    <option value="">Select</option><option>Male</option><option>Female</option><option>Other</option>
                </select>
            </div>
            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required></div>
            <div class="col-md-6"><label class="form-label">Disease</label><input class="form-control" name="disease" required></div>
            <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3" required></textarea></div>
            <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="{{ url_for('patients') }}">Cancel</a></div>
        </form>
    </div>
</div>
{% endblock %}
