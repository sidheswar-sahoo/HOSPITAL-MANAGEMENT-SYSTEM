{% extends 'base.html' %}
{% block title %}Edit Doctor{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body">
        <h3 class="mb-3">Edit Doctor</h3>
        <form method="post" class="row g-3">
            <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ doctor.name }}" required></div>
            <div class="col-md-6"><label class="form-label">Specialization</label><input class="form-control" name="specialization" value="{{ doctor.specialization }}" required></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ doctor.phone }}" required></div>
            <div class="col-md-6"><label class="form-label">Room No</label><input class="form-control" name="room_no" value="{{ doctor.room_no }}" required></div>
            <div class="col-12"><button class="btn btn-primary">Update</button> <a class="btn btn-secondary" href="{{ url_for('doctors') }}">Cancel</a></div>
        </form>
    </div>
</div>
{% endblock %}
