{% extends 'base.html' %}
{% block title %}Edit Appointment{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body">
        <h3 class="mb-3">Edit Appointment</h3>
        <form method="post" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Patient</label>
                <select class="form-select" name="patient_id" required>
                    {% for patient in patients %}
                    <option value="{{ patient.patient_id }}" {% if patient.patient_id == appointment.patient_id %}selected{% endif %}>{{ patient.name }} (ID: {{ patient.patient_id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Doctor</label>
                <select class="form-select" name="doctor_id" required>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.doctor_id }}" {% if doctor.doctor_id == appointment.doctor_id %}selected{% endif %}>Dr. {{ doctor.name }} - {{ doctor.specialization }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4"><label class="form-label">Date</label><input type="date" class="form-control" name="appointment_date" value="{{ appointment.appointment_date }}" required></div>
            <div class="col-md-4"><label class="form-label">Time</label><input type="time" class="form-control" name="appointment_time" value="{{ appointment.appointment_time }}" required></div>
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select class="form-select" name="status" required>
                    <option value="Scheduled" {% if appointment.status=='Scheduled' %}selected{% endif %}>Scheduled</option>
                    <option value="Completed" {% if appointment.status=='Completed' %}selected{% endif %}>Completed</option>
                    <option value="Cancelled" {% if appointment.status=='Cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
            </div>
            <div class="col-12"><button class="btn btn-primary">Update</button> <a class="btn btn-secondary" href="{{ url_for('appointments') }}">Cancel</a></div>
        </form>
    </div>
</div>
{% endblock %}
